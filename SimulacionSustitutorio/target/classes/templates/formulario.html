<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Asignatura</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        .navbar { background-color: #0d1b2a; color: white; padding: 15px 20px; font-size: 1.2rem; font-weight: bold; }
        .card { max-width: 500px; margin: 40px auto; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { background-color: #007bff; color: white; padding: 15px 20px; font-size: 1.25rem; font-weight: bold; }
        .card-body { padding: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; margin-bottom: 6px; font-weight: 600; color: #495057; }
        .form-control, .form-select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 4px; font-size: 0.95rem; }
        .form-control:focus, .form-select:focus { border-color: #80bdff; outline: none; }
        .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.95rem; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="navbar">📚 Intranet Cibertec - Gestión</div>

    <div class="card">
        <div class="card-header">Formulario de Registro</div>
        <div class="card-body">
            <form th:action="@{/asignaturas/grabar}" th:object="${asignatura}" method="post">
                
                <div class="form-group">
                    <label class="form-label">Nombre del Curso:</label>
                    <input type="text" th:field="*{nombreCurso}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Cantidad de Créditos:</label>
                    <input type="number" th:field="*{creditos}" class="form-control" min="1" required />
                </div>

				<!-- Busca esta sección en tu formulario y cámbiala exactamente así -->
				<div class="form-group">
				    <label class="form-label">Carrera de Destino:</label>
				    <select th:field="*{carrera}" class="form-select" required>
				        <option value="">-- Seleccione una carrera --</option>
				        <option th:each="c : ${listaCarreras}" 
				                th:value="${c.idCarrera}" 
				                th:text="${c.nombreCarrera}">
				        </option>
				    </select>
				</div>


                <div class="btn-group">
                    <a th:href="@{/asignaturas/listar}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Registro</button>
                </div>
                
            </form>
        </div>
    </div>

</body>
</html>
